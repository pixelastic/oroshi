# Mock SSH server config (drop-in, loaded via Include in sshd_config)

# Key-based auth only
PasswordAuthentication no

# Stable host key (committed) so the client fingerprint never changes
HostKey /etc/ssh/ssh_host_ed25519_key

# Allow 100 parallel connections, hopefully enough for CI/CD tests that run in parallel
MaxStartups 100:30:200

# MaxSessions lifts the per-connection channel cap so a multiplexed master
# (ControlMaster) can carry many concurrent sessions over one connection
MaxSessions 200
