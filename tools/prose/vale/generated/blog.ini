StylesPath = ../styles
MinAlertLevel = suggestion

Packages = write-good, proselint, Google

[*]
BasedOnStyles = write-good, proselint, Google

# Disabled — write-good
write-good.E-Prime = NO
write-good.TooWordy = NO
write-good.Passive = NO
write-good.Cliches = NO

# Disabled — Google (whitelist approach: disable all, enable below)
Google.AMPM = NO
Google.Acronyms = suggestion
Google.Anthropomorphism = NO
Google.Colons = NO
Google.Contractions = NO
Google.DateFormat = NO
Google.Ellipses = NO
Google.EmDash = NO
Google.ExcessiveClaims = NO
Google.Exclamation = NO
Google.FirstPerson = NO
Google.Gender = NO
Google.GenderBias = NO
Google.HeadingPunctuation = NO
Google.Headings = NO
Google.Jargon = NO
Google.Latin = NO
Google.LyHyphens = NO
Google.OptionalPlurals = NO
Google.Ordinal = NO
Google.OxfordComma = error
Google.Parens = NO
Google.Periods = NO
Google.Quotes = NO
Google.Ranges = NO
Google.Semicolons = NO
Google.Slang = NO
Google.Spacing = NO
Google.Spelling = NO
Google.Timeless = NO
Google.Units = NO
Google.We = NO
Google.Will = NO
Google.WordListCase = NO

# Error: must fix to zero
write-good.Weasel = error
write-good.Illusions = error
proselint.But = error

# Warning: best effort
write-good.ThereIs = warning
Google.WordList = warning

# Suggestion: soft feedback
Google.Passive = suggestion
