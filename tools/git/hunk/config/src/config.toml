# Run `colors-reload` after editing this file
theme = "custom"
mode = "unified"
watch = true
menu_bar = false
line_numbers = false
hunk_headers = false
transparent_background = false
exclude_untracked = true

# Keybindings {{{
[keybindings]
# General
"hunk.app.quit" = "q"
"hunk.app.toggleHelp" = "?"
"hunk.view.openThemeSelector" = "t"
"hunk.view.toggleLineWrap" = "f9"
"hunk.view.toggleSidebar" = "s"
"hunk.view.toggleMenuBar" = "m"
"hunk.review.toggleHunkGap" = "z"
"hunk.review.startNote" = "enter"
"hunk.review.editSelectedFile" = "e"
"hunk.view.layoutSplit" = "i"
"hunk.view.layoutStack" = "o"

# Scrolling
"hunk.review.nextHunk" = ["l", "J"]
"hunk.review.previousHunk" = ["h", "K"]
"hunk.review.stepDown" = "j"
"hunk.review.stepUp" = "k"
"hunk.review.halfPageDown" = "d"
"hunk.review.halfPageUp" = "u"
"hunk.review.jumpToTop" = "g"
"hunk.review.jumpToBottom" = "G"
"hunk.review.scrollCodeLeft" = ["left", "shift+left"]
"hunk.review.scrollCodeRight" = ["right", "shift+right"]

# Disabled
"hunk.view.toggleAgentNotes" = false
"hunk.view.layoutAuto" = false
"hunk.app.refresh" = false
"hunk.app.toggleFocusArea" = false
"hunk.review.focusFilter" = false
"hunk.review.nextAnnotatedHunk" = false
"hunk.review.nextFile" = false
"hunk.review.pageDown" = false
"hunk.review.pageUp" = false
"hunk.review.previousAnnotatedHunk" = false
"hunk.review.previousFile" = false
"hunk.view.toggleHunkHeaders" = false
"hunk.view.toggleLineNumbers" = false
# }}}

# Custom theme {{{
# All tokens set to unknown (cyan) to identify hardcoded colors
[custom_theme]
base = "github-dark-default"
label = "Oroshi"

text = "{{header:hex}}" # File names, window titles
# UI
background = "{{terminal:hex}}"      # Borders around the UI
accentMuted = "{{gray-4:hex}}"       # Scrollbar handle
accent = "{{punctuation:hex}}"       # Window borders, keybindings
badgeNeutral = "{{key:hex}}"         # [Esc]
border = "{{gray-6:hex}}"            # Between files
muted = "{{gray:hex}}"               # Comments, descriptions
panel = "{{black:hex}}"              # Window background
panelAlt = "{{terminal:hex}}"        # Menu bg, "X unchanged files" bg
lineNumberBg = "{{terminal:hex}}"    # +/- gutter bg
lineNumberFg = "{{ui:hex}}"          # Default gutter color
contextBg = "{{terminal:hex}}"       # Unchanged lines bg
badgeAdded = "{{git-added:hex}}"     # + files added
badgeRemoved = "{{git-removed:hex}}" # - files deleted
noteBorder = "{{ai:hex}}"
noteTitleText = "{{ui:hex}}"
noteTitleBackground = "{{ai:hex}}"   # [+] Overlay to add a note

# Diff
removedBg = "{{red-dark:hex}}"           # Delete lines bg
removedContentBg = "{{red-dark:hex}}"    # Delete lines highlight
removedSignColor = "{{git-removed:hex}}" # - symbol color
addedBg = "{{green-dark:hex}}"           # Added lines bg
addedContentBg = "{{green-dark:hex}}"    # Added lines highlight
addedSignColor = "{{git-added:hex}}"     # + symbol color


# Unknown
contextContentBg = "{{unknown:hex}}"
fileDeleted = "{{unknown:hex}}"
fileModified = "{{unknown:hex}}"
fileNew = "{{unknown:hex}}"
fileRenamed = "{{unknown:hex}}"
fileUntracked = "{{unknown:hex}}"
movedAddedBg = "{{unknown:hex}}"
movedRemovedBg = "{{unknown:hex}}"
noteBackground = "{{unknown:hex}}"
selectedHunk = "{{unknown:hex}}"

[custom_theme.syntax_scopes]
"comment" = "{{comment:hex}}"
"constant.character.escape" = "{{special-char:hex}}"
"constant.language" = "{{constant:hex}}"
"constant.language.boolean" = "{{boolean:hex}}"
"constant.numeric" = "{{number:hex}}"
"constant.regexp" = "{{special-char:hex}}"
"entity.name.class" = "{{variable-type:hex}}"
"entity.name.function" = "{{function:hex}}"
"entity.name.namespace" = "{{import:hex}}"
"entity.name.section" = "{{header:hex}}"
"entity.name.tag" = "{{variable-type:hex}}"
"entity.name.type" = "{{variable-type:hex}}"
"entity.other.attribute-name" = "{{variable-type:hex}}"
"entity.other.inherited-class" = "{{variable-type:hex}}"
"invalid" = "{{git-removed:hex}}"
"invalid.deprecated" = "{{git-removed:hex}}"
"keyword" = "{{keyword:hex}}"
"keyword.control" = "{{keyword:hex}}"
"keyword.control.import" = "{{import:hex}}"
"keyword.operator" = "{{punctuation:hex}}"
"markup.underline.link" = "{{string:hex}}"
"meta" = "{{comment:hex}}"
"meta.function-call" = "{{function:hex}}"
"punctuation" = "{{punctuation:hex}}"
"punctuation.definition.comment" = "{{comment:hex}}"
"punctuation.definition.string" = "{{string:hex}}"
"storage" = "{{variable-type:hex}}"
"storage.modifier" = "{{variable-type:hex}}"
"storage.type" = "{{variable-type:hex}}"
"string" = "{{string:hex}}"
"support.function" = "{{statement:hex}}"
"support.type" = "{{variable-type:hex}}"
"support.type.property-name" = "{{variable:hex}}"
"support.variable" = "{{variable:hex}}"
"variable" = "{{variable:hex}}"
"variable.other" = "{{variable:hex}}"
"variable.other.property" = "{{variable:hex}}"
"variable.parameter" = "{{variable:hex}}"
# }}}
